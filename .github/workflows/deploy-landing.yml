name: Deploy Landing Page

on:
  push:
    branches: [main]
    paths:
      - "frontend/landing/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/landing/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm -C frontend/landing install --frozen-lockfile

      - name: Prepare NitroPay ads.txt
        env:
          CHRONICLE_NITROPAY_SITE_ID: ${{ vars.NITROPAY_SITE_ID }}
        run: |
          rm -f frontend/landing/public/ads.txt
          if [ -n "$CHRONICLE_NITROPAY_SITE_ID" ]; then
            curl --fail --silent --show-error --location \
              "https://api.nitropay.com/v1/ads-${CHRONICLE_NITROPAY_SITE_ID}.txt" \
              --output frontend/landing/public/ads.txt
          fi

      - name: Build
        env:
          CHRONICLE_NITROPAY_SITE_ID: ${{ vars.NITROPAY_SITE_ID }}
        run: pnpm -C frontend/landing build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/landing/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
