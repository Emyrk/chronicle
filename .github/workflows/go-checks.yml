name: CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-checks.yml'
  push:
    branches:
      - main
      - develop
    tags:
      - '*'
  workflow_dispatch:

# Cancel in-progress runs when a new workflow with the same SHA is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golangci-lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v2.6.2"
          args: --timeout=10m --verbose
          # Optional: show only new issues if it's a pull request
          only-new-issues: ${{ github.event_name == 'pull_request' }}

  test:
    name: Test (gotestsum)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run postgres
        run: make test-postgres-docker

      - name: Run tests with gotestsum
        run: |
          make test

  # Summary job that all branch protection rules should target
  go-checks-summary:
    name: Go Checks Summary
    runs-on: ubuntu-latest
    needs: [golangci-lint, test]
    if: always()
    
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.golangci-lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "One or more checks failed:"
            echo "  Lint (golangci-lint): ${{ needs.golangci-lint.result }}"
            echo "  Test (gotestsum): ${{ needs.test.result }}"
            exit 1
          fi
          echo "All Go checks passed! ✅"

  docker-push:
    name: Build and Push Docker Image
    needs: [golangci-lint, test]
    runs-on: ubuntu-latest
    environment: actions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git describe

      - name: Get version info
        id: version
        run: |
          echo "GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo 'unknown')" >> $GITHUB_OUTPUT
          echo "GIT_COMMIT=$(git describe --always)" >> $GITHUB_OUTPUT
          echo "BUILD_TIME=$(TZ='America/Chicago' date +'%m-%d-%y_%H:%M')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/chronicled/Dockerfile
          push: true
          tags: emyrk/chronicled:${{ github.ref_type == 'tag' && 'latest' || 'unstable' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_TAG=${{ steps.version.outputs.GIT_TAG }}
            GIT_COMMIT=${{ steps.version.outputs.GIT_COMMIT }}
            BUILD_TIME=${{ steps.version.outputs.BUILD_TIME }}

  deploy-railway:
    name: Deploy to Railway (${{ matrix.server }})
    if: github.ref_type == 'tag'
    needs: docker-push
    runs-on: ubuntu-latest
    environment: railway
    strategy:
      fail-fast: false
      matrix:
        include:
#          - server: turtle
#            railway_service: chronicled
#            railway_token_secret: RAILWAY_TOKEN
#          - server: epoch
#            railway_service: chronicled
#            railway_token_secret: RAILWAY_TOKEN_EPOCH
#          - server: vanillaplus
#            railway_service: chronicled
#            railway_token_secret: RAILWAY_TOKEN_VANILLAPLUS
#          - server: azerothcore
#            railway_service: chronicled
#            railway_token_secret: RAILWAY_TOKEN_WARMANE
#          - server: ascension
#            railway_service: chronicled
#            railway_token_secret: RAILWAY_TOKEN_ASCENSION
#          - server: octowow
#            railway_service: chronicled
#            railway_token_secret: RAILWAY_TOKEN_OCTOWOW
          - server: legacy
            railway_service: chronicled
            railway_token_secret: RAILWAY_TOKEN_LEGACY
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Redeploy ${{ matrix.server }} on Railway
        run: railway redeploy --service ${{ matrix.railway_service }} --yes
        env:
          RAILWAY_TOKEN: ${{ secrets[matrix.railway_token_secret] }}
