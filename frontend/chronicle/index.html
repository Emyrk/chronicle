<!doctype html>
<html lang="en" class="dark" style="{{ .ThemeCSS }}">
  <head>
    <script>
      // /start: start the hero poster fetch before the app stylesheet and bundle; the
      // pre-JS poster shell at the end of <body> paints it (media queries must match).
      if (location.pathname === "/start") {
        [["(max-width: 1023px)", "ruins-courtyard-poster-portrait.jpg"], ["(min-width: 1024px)", "ruins-courtyard-poster.jpg"]].forEach(function (p) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.media = p[0];
          link.href = "/c/images/landing/" + p[1];
          link.fetchPriority = "high";
          document.head.appendChild(link);
        });
      }
    </script>
    <!-- {{ if .GA4ID }} -->
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ .GA4ID }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      const query = new URLSearchParams(window.location.search);
      const chronicleAttribution = {};
      ['chr_src', 'chr_pos', 'chr_cmp'].forEach((parameter) => {
        const value = query.get(parameter);
        if (value) {
          chronicleAttribution[parameter] = value;
        }
      });

      gtag('config', '{{ .GA4ID }}', chronicleAttribution);
    </script>
    <!-- {{ end }} -->

    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="{{ if .Favicon }}{{ .Favicon }}{{ else }}/c/chronicle/favicon.ico{{ end }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{ if .OGDescription }}{{ .OGDescription }}{{ else if .Description }}{{ .Description }}{{ else }}Chronicle provides combat log analysis for World of Warcraft communities. Upload combat logs to explore encounters, rankings, and performance insights.{{ end }}" />
    <!-- {{ if .CanonicalURL }} --><link rel="canonical" href="{{ .CanonicalURL }}" /><!-- {{ end }} -->
    <!-- {{ if .Robots }} --><meta name="robots" content="{{ .Robots }}" /><!-- {{ end }} -->

    <!-- Open Graph / Social -->
    <meta property="og:site_name" content="{{ if .SiteName }}{{ .SiteName }}{{ else }}Chronicle{{ end }}" />
    <meta property="og:title" content="{{ if .OGTitle }}{{ .OGTitle }}{{ else if .Title }}{{ .Title }}{{ else }}Chronicle - WoW Raid Log Analysis{{ end }}" />
    <meta property="og:description" content="{{ if .OGDescription }}{{ .OGDescription }}{{ else if .Description }}{{ .Description }}{{ else }}Chronicle provides combat log analysis for World of Warcraft communities. Upload combat logs to explore encounters, rankings, and performance insights.{{ end }}" />
    <meta property="og:type" content="website" />
    <!-- {{ if .CanonicalURL }} --><meta property="og:url" content="{{ .CanonicalURL }}" /><!-- {{ end }} -->
    <!-- {{ if .ImageURL }} --><meta property="og:image" content="{{ .ImageURL }}" /><!-- {{ end }} -->
    <meta name="twitter:card" content="{{ if .ImageURL }}summary_large_image{{ else }}summary{{ end }}" />
    <meta name="twitter:title" content="{{ if .OGTitle }}{{ .OGTitle }}{{ else if .Title }}{{ .Title }}{{ else }}Chronicle - WoW Raid Log Analysis{{ end }}" />
    <meta name="twitter:description" content="{{ if .OGDescription }}{{ .OGDescription }}{{ else if .Description }}{{ .Description }}{{ else }}Chronicle provides combat log analysis for World of Warcraft communities. Upload combat logs to explore encounters, rankings, and performance insights.{{ end }}" />
    <!-- {{ if .ImageURL }} --><meta name="twitter:image" content="{{ .ImageURL }}" /><!-- {{ end }} -->
    <!-- {{ if .JSONLD }} --><script type="application/ld+json">{{ .JSONLD }}</script><!-- {{ end }} -->
    
    <meta property="GitCommit" content="{{ .GitCommit }}" />
    <meta property="GitTag" content="{{ .GitTag }}" />
    <meta property="BuildTime" content="{{ .BuildTime }}" />
    <title>{{ if .Title }}{{ .Title }}{{ else }}Chronicle{{ end }}</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // /start: paint the hero poster before the app bundle loads, so the poster is the
      // LCP element. StartPage removes this copy when it mounts its own identical hero.
      // Geometry and images must match pages/Landing/LandingHero.tsx and StartPage.tsx.
      if (location.pathname === "/start") {
        var shell = document.createElement("div");
        shell.id = "start-poster-shell";
        shell.setAttribute("aria-hidden", "true");
        shell.innerHTML =
          "<style>" +
          "#start-poster-shell{position:absolute;inset:0 0 auto;height:576px;z-index:60;background:#0c1322;overflow:hidden}" +
          "#start-poster-shell>div{position:absolute;inset:55px 0 0;border-top:1px solid #27324a;border-bottom:1px solid #27324a;background:#101829}" +
          "#start-poster-shell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 55%}" +
          "#start-poster-shell i{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,19,34,.25),rgba(12,19,34,.35) 50%,rgba(12,19,34,.95))}" +
          "@media (min-width:1024px){#start-poster-shell{height:644px}#start-poster-shell>div{top:63px}" +
          "#start-poster-shell i{background:linear-gradient(180deg,rgba(12,19,34,0) calc(100% - 150px),rgba(12,19,34,.95)),linear-gradient(90deg,rgba(12,19,34,.94),rgba(12,19,34,.78) 38%,rgba(12,19,34,.12))}}" +
          "</style><div><picture>" +
          '<source media="(max-width: 1023px)" srcset="/c/images/landing/ruins-courtyard-poster-portrait.jpg">' +
          '<img src="/c/images/landing/ruins-courtyard-poster.jpg" alt="" fetchpriority="high">' +
          "</picture><i></i></div>";
        document.body.appendChild(shell);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
