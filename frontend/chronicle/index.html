<!doctype html>
<html lang="en" class="dark" style="{{ .ThemeCSS }}">
  <head>
    <script>
      // /start: pick this visit's hero clip (they rotate per visit) and start its poster fetch before the
      // app stylesheet and bundle; the pre-JS poster shell at the end of <body> paints it (media queries
      // must match). The app reads the pick from these data attributes (pages/Landing/heroClips.ts).
      // HERO_CLIPS mirrors clips.json's slug, poster and portrait.poster (heroClips.test.ts checks it).
      (function () {
        var HERO_CLIPS = [
          ["-8uWqvAo4Qa4Oa5l", "/c/images/landing/clips/zg-hakkar.5e485f45.webp", "/c/images/landing/clips/zg-hakkar-portrait.3211329e.webp"],
          ["cpegIP_Qz9m6JEnZ", "/c/images/landing/clips/mc-ragnaros.d3702349.webp", "/c/images/landing/clips/mc-ragnaros-portrait.38792648.webp"]
        ];
        var start = location.pathname === "/start";
        var visit = 0;
        try {
          visit = Number(localStorage.getItem("landing-hero-clip")) || 0;
          if (start) localStorage.setItem("landing-hero-clip", String(visit + 1));
        } catch (e) {}
        var clip = HERO_CLIPS[visit % HERO_CLIPS.length];
        var data = document.documentElement.dataset;
        data.heroClip = clip[0];
        data.heroPoster = clip[1];
        data.heroPosterPortrait = clip[2];
        if (!start) return;
        [["(max-width: 1023px)", clip[2]], ["(min-width: 1024px)", clip[1]]].forEach(function (p) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.media = p[0];
          link.href = p[1];
          link.fetchPriority = "high";
          document.head.appendChild(link);
        });
      })();
    </script>
    <!-- {{ if .GA4ID }} -->
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ .GA4ID }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      const query = new URLSearchParams(window.location.search);
      const chronicleAttribution = {};
      ['chr_src', 'chr_pos', 'chr_cmp'].forEach((parameter) => {
        const value = query.get(parameter);
        if (value) {
          chronicleAttribution[parameter] = value;
        }
      });

      gtag('config', '{{ .GA4ID }}', chronicleAttribution);
    </script>
    <!-- {{ end }} -->

    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="{{ if .Favicon }}{{ .Favicon }}{{ else }}/c/chronicle/favicon.ico{{ end }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{ if .OGDescription }}{{ .OGDescription }}{{ else if .Description }}{{ .Description }}{{ else }}Chronicle provides combat log analysis for World of Warcraft communities. Upload combat logs to explore encounters, rankings, and performance insights.{{ end }}" />
    <!-- {{ if .CanonicalURL }} --><link rel="canonical" href="{{ .CanonicalURL }}" /><!-- {{ end }} -->
    <!-- {{ if .Robots }} --><meta name="robots" content="{{ .Robots }}" /><!-- {{ end }} -->

    <!-- Open Graph / Social -->
    <meta property="og:site_name" content="{{ if .SiteName }}{{ .SiteName }}{{ else }}Chronicle{{ end }}" />
    <meta property="og:title" content="{{ if .OGTitle }}{{ .OGTitle }}{{ else if .Title }}{{ .Title }}{{ else }}Chronicle - WoW Raid Log Analysis{{ end }}" />
    <meta property="og:description" content="{{ if .OGDescription }}{{ .OGDescription }}{{ else if .Description }}{{ .Description }}{{ else }}Chronicle provides combat log analysis for World of Warcraft communities. Upload combat logs to explore encounters, rankings, and performance insights.{{ end }}" />
    <meta property="og:type" content="website" />
    <!-- {{ if .CanonicalURL }} --><meta property="og:url" content="{{ .CanonicalURL }}" /><!-- {{ end }} -->
    <!-- {{ if .ImageURL }} --><meta property="og:image" content="{{ .ImageURL }}" /><!-- {{ end }} -->
    <meta name="twitter:card" content="{{ if .ImageURL }}summary_large_image{{ else }}summary{{ end }}" />
    <meta name="twitter:title" content="{{ if .OGTitle }}{{ .OGTitle }}{{ else if .Title }}{{ .Title }}{{ else }}Chronicle - WoW Raid Log Analysis{{ end }}" />
    <meta name="twitter:description" content="{{ if .OGDescription }}{{ .OGDescription }}{{ else if .Description }}{{ .Description }}{{ else }}Chronicle provides combat log analysis for World of Warcraft communities. Upload combat logs to explore encounters, rankings, and performance insights.{{ end }}" />
    <!-- {{ if .ImageURL }} --><meta name="twitter:image" content="{{ .ImageURL }}" /><!-- {{ end }} -->
    <!-- {{ if .JSONLD }} --><script type="application/ld+json">{{ .JSONLD }}</script><!-- {{ end }} -->
    
    <meta property="GitCommit" content="{{ .GitCommit }}" />
    <meta property="GitTag" content="{{ .GitTag }}" />
    <meta property="BuildTime" content="{{ .BuildTime }}" />
    <title>{{ if .Title }}{{ .Title }}{{ else }}Chronicle{{ end }}</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // /start: paint the hero poster before the app bundle loads, so the poster is the
      // LCP element. StartPage removes this copy when it mounts its own identical hero.
      // Geometry and images must match pages/Landing/LandingHero.tsx and StartPage.tsx.
      if (location.pathname === "/start") {
        var shell = document.createElement("div");
        shell.id = "start-poster-shell";
        shell.setAttribute("aria-hidden", "true");
        shell.innerHTML =
          // Colours are the tenant theme vars (the html element's style attribute), falling back to index.css :root.
          "<style>" +
          "#start-poster-shell{--b:var(--background,oklch(.2891 0 0));position:absolute;inset:0 0 auto;height:589px;z-index:60;background:var(--b);overflow:hidden}" +
          "#start-poster-shell>div{position:absolute;inset:68px 0 0;border-top:1px solid var(--border,oklch(.3407 0 0));border-bottom:1px solid var(--border,oklch(.3407 0 0));background:var(--card,oklch(.2686 0 0))}" +
          "#start-poster-shell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 55%}" +
          "#start-poster-shell i{position:absolute;inset:0;background:linear-gradient(180deg in oklab,color-mix(in oklab,var(--b) 25%,transparent),color-mix(in oklab,var(--b) 35%,transparent) 50%,color-mix(in oklab,var(--b) 95%,transparent))}" +
          "@media (min-width:768px){#start-poster-shell{height:593px}#start-poster-shell>div{top:72px}}" +
          "@media (min-width:1024px){#start-poster-shell{height:653px}" +
          "#start-poster-shell i{background:linear-gradient(180deg in oklab,color-mix(in oklab,var(--b) 0%,transparent) calc(100% - 150px),color-mix(in oklab,var(--b) 95%,transparent)),linear-gradient(90deg in oklab,color-mix(in oklab,var(--b) 95%,transparent),color-mix(in oklab,var(--b) 80%,transparent) 38%,color-mix(in oklab,var(--b) 10%,transparent))}}" +
          "</style><div><picture>" +
          '<source media="(max-width: 1023px)" srcset="' + document.documentElement.dataset.heroPosterPortrait + '">' +
          '<img src="' + document.documentElement.dataset.heroPoster + '" alt="" fetchpriority="high">' +
          "</picture><i></i></div>";
        document.body.appendChild(shell);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
