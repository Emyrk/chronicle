<!doctype html>
<html lang="en" class="dark" style="{{ .ThemeCSS }}">
  <head>
    <script>
      // AI keys (?ai_key=ck_…) are for chat AIs and are never a browser login.
      // Remove the key from the address bar before any other script runs, so
      // GA4's page_location and ad scripts never see it. This must stay the
      // first script in <head> (features/aiKey/stripAIKeyScript.test.ts checks).
      // The app reads window.__chronicleAIKey once to show the owner a banner.
      (function () {
        try {
          var search = location.search;
          if (!search) return;
          var key = null;
          var kept = search.slice(1).split("&").filter(function (part) {
            if (!part) return false;
            var name = part.split("=", 1)[0];
            var decoded;
            try { decoded = decodeURIComponent(name.replace(/\+/g, " ")); } catch (e) { return true; }
            if (decoded !== "ai_key") return true;
            var value = part.slice(name.length + 1);
            try { key = decodeURIComponent(value.replace(/\+/g, " ")); } catch (e) { key = value; }
            return false;
          });
          if (key === null) return;
          history.replaceState(history.state, "", location.pathname + (kept.length ? "?" + kept.join("&") : "") + location.hash);
          // Not enumerable, so scripts that walk window properties don't pick it up.
          Object.defineProperty(window, "__chronicleAIKey", { value: key, enumerable: false, configurable: true, writable: true });
        } catch (e) {}
      })();
    </script>
    <script>
      // The WoW Forever landing (/ and /start2): pick this visit's hero clip (they rotate per visit).
      // The app reads the pick from these data attributes (pages/Landing/heroClips.ts).
      // HERO_CLIPS mirrors clips.json's slug, poster and portrait.poster (heroClips.test.ts checks it).
      (function () {
        var HERO_CLIPS = [
          ["EyA_KB9Obm_lhskE", "/c/images/landing/clips/ruins-rathmael.545c2f6e.webp", "/c/images/landing/clips/ruins-rathmael-portrait.00527869.webp"],
          ["BItVqdXkz3j7UyoD", "/c/images/landing/clips/wc-mutanus.7080f1fa.webp", "/c/images/landing/clips/wc-mutanus-portrait.7d4003c6.webp"]
        ];
        var landing = location.pathname === "/" || location.pathname === "/start2";
        var visit = 0;
        try {
          visit = Number(localStorage.getItem("landing-hero-clip")) || 0;
          if (landing) localStorage.setItem("landing-hero-clip", String(visit + 1));
        } catch (e) {}
        var clip = HERO_CLIPS[visit % HERO_CLIPS.length];
        var data = document.documentElement.dataset;
        data.heroClip = clip[0];
        data.heroPoster = clip[1];
        data.heroPosterPortrait = clip[2];
      })();
    </script>
    <!-- {{ if .GA4ID }} -->
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ .GA4ID }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      const query = new URLSearchParams(window.location.search);
      const chronicleAttribution = {};
      ['chr_src', 'chr_pos', 'chr_cmp'].forEach((parameter) => {
        const value = query.get(parameter);
        if (value) {
          chronicleAttribution[parameter] = value;
        }
      });

      gtag('config', '{{ .GA4ID }}', chronicleAttribution);
    </script>
    <!-- {{ end }} -->

    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="{{ if .Favicon }}{{ .Favicon }}{{ else }}/c/chronicle/favicon.ico{{ end }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{ if .OGDescription }}{{ .OGDescription }}{{ else if .Description }}{{ .Description }}{{ else }}Chronicle provides combat log analysis for World of Warcraft communities. Upload combat logs to explore encounters, rankings, and performance insights.{{ end }}" />
    <!-- {{ if .CanonicalURL }} --><link rel="canonical" href="{{ .CanonicalURL }}" /><!-- {{ end }} -->
    <!-- {{ if .Robots }} --><meta name="robots" content="{{ .Robots }}" /><!-- {{ end }} -->

    <!-- Open Graph / Social -->
    <meta property="og:site_name" content="{{ if .SiteName }}{{ .SiteName }}{{ else }}Chronicle{{ end }}" />
    <meta property="og:title" content="{{ if .OGTitle }}{{ .OGTitle }}{{ else if .Title }}{{ .Title }}{{ else }}Chronicle - WoW Raid Log Analysis{{ end }}" />
    <meta property="og:description" content="{{ if .OGDescription }}{{ .OGDescription }}{{ else if .Description }}{{ .Description }}{{ else }}Chronicle provides combat log analysis for World of Warcraft communities. Upload combat logs to explore encounters, rankings, and performance insights.{{ end }}" />
    <meta property="og:type" content="website" />
    <!-- {{ if .CanonicalURL }} --><meta property="og:url" content="{{ .CanonicalURL }}" /><!-- {{ end }} -->
    <!-- {{ if .ImageURL }} --><meta property="og:image" content="{{ .ImageURL }}" /><!-- {{ end }} -->
    <meta name="twitter:card" content="{{ if .ImageURL }}summary_large_image{{ else }}summary{{ end }}" />
    <meta name="twitter:title" content="{{ if .OGTitle }}{{ .OGTitle }}{{ else if .Title }}{{ .Title }}{{ else }}Chronicle - WoW Raid Log Analysis{{ end }}" />
    <meta name="twitter:description" content="{{ if .OGDescription }}{{ .OGDescription }}{{ else if .Description }}{{ .Description }}{{ else }}Chronicle provides combat log analysis for World of Warcraft communities. Upload combat logs to explore encounters, rankings, and performance insights.{{ end }}" />
    <!-- {{ if .ImageURL }} --><meta name="twitter:image" content="{{ .ImageURL }}" /><!-- {{ end }} -->
    <!-- {{ if .JSONLD }} --><script type="application/ld+json">{{ .JSONLD }}</script><!-- {{ end }} -->
    
    <meta property="GitCommit" content="{{ .GitCommit }}" />
    <meta property="GitTag" content="{{ .GitTag }}" />
    <meta property="BuildTime" content="{{ .BuildTime }}" />
    <title>{{ if .Title }}{{ .Title }}{{ else }}Chronicle{{ end }}</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
