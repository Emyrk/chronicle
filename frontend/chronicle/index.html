<!doctype html>
<html lang="en" class="dark" style="{{ .ThemeCSS }}">
  <head>
    <!-- Allows live tweaking -->
    <script src="https://tweakcn.com/live-preview.min.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G0Q1B9GRC0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      const query = new URLSearchParams(window.location.search);
      const chronicleAttribution = {};
      ['chr_src', 'chr_pos', 'chr_cmp'].forEach((parameter) => {
        const value = query.get(parameter);
        if (value) {
          chronicleAttribution[parameter] = value;
        }
      });

      gtag('config', 'G-G0Q1B9GRC0', chronicleAttribution);
    </script>


    <!-- {{ if .AdSenseClientID }} -->
    <meta name="google-adsense-account" content="{{ .AdSenseClientID }}" />
    <!-- {{ end }} -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="{{ if .Favicon }}{{ .Favicon }}{{ else }}/c/chronicle/favicon.ico{{ end }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{ if .OGDescription }}{{ .OGDescription }}{{ else if .Description }}{{ .Description }}{{ else }}Chronicle provides combat log analysis for World of Warcraft communities. Upload combat logs to explore encounters, rankings, and performance insights.{{ end }}" />
    <!-- {{ if .CanonicalURL }} --><link rel="canonical" href="{{ .CanonicalURL }}" /><!-- {{ end }} -->
    <!-- {{ if .Robots }} --><meta name="robots" content="{{ .Robots }}" /><!-- {{ end }} -->

    <!-- Open Graph / Social -->
    <meta property="og:site_name" content="{{ if .SiteName }}{{ .SiteName }}{{ else }}Chronicle{{ end }}" />
    <meta property="og:title" content="{{ if .OGTitle }}{{ .OGTitle }}{{ else if .Title }}{{ .Title }}{{ else }}Chronicle - WoW Raid Log Analysis{{ end }}" />
    <meta property="og:description" content="{{ if .OGDescription }}{{ .OGDescription }}{{ else if .Description }}{{ .Description }}{{ else }}Chronicle provides combat log analysis for World of Warcraft communities. Upload combat logs to explore encounters, rankings, and performance insights.{{ end }}" />
    <meta property="og:type" content="website" />
    <!-- {{ if .CanonicalURL }} --><meta property="og:url" content="{{ .CanonicalURL }}" /><!-- {{ end }} -->
    <!-- {{ if .ImageURL }} --><meta property="og:image" content="{{ .ImageURL }}" /><!-- {{ end }} -->
    <meta name="twitter:card" content="{{ if .ImageURL }}summary_large_image{{ else }}summary{{ end }}" />
    <meta name="twitter:title" content="{{ if .OGTitle }}{{ .OGTitle }}{{ else if .Title }}{{ .Title }}{{ else }}Chronicle - WoW Raid Log Analysis{{ end }}" />
    <meta name="twitter:description" content="{{ if .OGDescription }}{{ .OGDescription }}{{ else if .Description }}{{ .Description }}{{ else }}Chronicle provides combat log analysis for World of Warcraft communities. Upload combat logs to explore encounters, rankings, and performance insights.{{ end }}" />
    <!-- {{ if .ImageURL }} --><meta name="twitter:image" content="{{ .ImageURL }}" /><!-- {{ end }} -->
    <!-- {{ if .JSONLD }} --><script type="application/ld+json">{{ .JSONLD }}</script><!-- {{ end }} -->
    
    <meta property="GitCommit" content="{{ .GitCommit }}" />
    <meta property="GitTag" content="{{ .GitTag }}" />
    <meta property="BuildTime" content="{{ .BuildTime }}" />
    <title>{{ if .Title }}{{ .Title }}{{ else }}Chronicle{{ end }}</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
