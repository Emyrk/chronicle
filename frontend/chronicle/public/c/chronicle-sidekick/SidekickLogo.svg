<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Chronicle Sidekick</title>
  <desc id="description">Three gold circles arranged in a triangle inside a gold letter C.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="68%">
      <stop offset="0" stop-color="#35322d" />
      <stop offset="1" stop-color="#242424" />
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1c17b" />
      <stop offset="1" stop-color="#c5a35f" />
    </linearGradient>
    <filter id="dot-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".32" />
    </filter>
  </defs>
  <circle cx="256" cy="256" r="252" fill="url(#background)" />
  <image href="data:image/webp;base64," width="512" height="512" />
  <g fill="url(#gold)" filter="url(#dot-shadow)">
    <circle cx="256" cy="210" r="30" />
    <circle cx="211" cy="292" r="30" />
    <circle cx="301" cy="292" r="30" />
  </g>
</svg>
