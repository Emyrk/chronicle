version: "2"
sql:
  - engine: "postgresql"
    queries: "./queries"
    schema: "dump.sql"
    gen:
      go:
        sql_package: "pgx/v5"
        package: "database"
        out: "./genqueries"
        emit_interface: true
        emit_json_tags: true
        emit_db_tags: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        rename:
          wow_log_group: "WoWLogGroup"
        overrides:
          # Override for non-nullable UUID columns
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          # Override for nullable UUID columns
          - db_type: "uuid"
            go_type: "github.com/google/uuid.NullUUID"
            nullable: true
          - db_type: "wow_log_group_files"
            go_type:
              type: "[]LogFile"
          - column: "instance_overview_metrics.top_incoming_damage_abilities"
            go_type:
              type: "[]OverviewIncomingDamageAbility"
          - column: "log_instance_encounter_damage_unit_summary.damage_done_abilities"
            go_type:
              type: "map[guid.GUID]map[string]Ability"
          - column: "log_instance_encounter_damage_unit_summary.damage_taken_abilities"
            go_type:
              type: "map[guid.GUID]map[string]Ability"
          - db_type: "wow_guid"
            go_type: "github.com/Emyrk/chronicle/combatlog/parser/guid.GUID"
          - db_type: "wow_guid"
            go_type: "*github.com/Emyrk/chronicle/combatlog/parser/guid.GUID"
            nullable: true
          - db_type: "activity_periods"
            go_type:
              type: "Periods"
          - column: "log_instance_encounters.remaining"
            go_type: "github.com/Emyrk/chronicle/combatlog/parser/guid.GUIDs"
          - column: "log_instances.versions"
            go_type:
              type: "VersionsMap"
          - column: "log_instances_guild.versions"
            go_type:
              type: "VersionsMap"
          - column: "log_instance_youtube_timestamped.payload"
            go_type:
              type: "[]VideoTimestamp"
          - column: "game_players.gear"
            go_type:
              type: "*PlayerOutfit"
          - column: "game_players.talents"
            go_type:
              type: "*PlayerTalents"