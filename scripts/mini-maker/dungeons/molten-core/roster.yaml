# Molten Core — boss roster for mini-maker.
# Blizzard IP: private/local use only.
#
# Pipeline input for every `mini.py ... --dungeon molten-core` command. Working
# state goes to work/molten-core/<boss>/, published minis to dungeons/molten-core/<boss>/.
#
# HOUSE SCULPT STYLE (what Meshy can actually reconstruct and a printer can
# actually print — proven on wailing-caverns):
#   - Thick, chunky, toy-like volumes. Antlers "as thick as a thumb", spikes
#     are "short chunky cones", teeth "short thick cones, few in number".
#   - Everything FUSED: weapons/staffs touch a hand AND the base; snakes,
#     vines, tails are "one fat coil fused to the shoulders / the base";
#     legs and feet "merge into the base".
#   - NO thin spikes, no thin sheets (frills, fins, wings are "thick solid
#     slabs with no holes"), no loose strands, no floating sparkles or
#     particles. Glow/electricity/magic is a PAINT accent, never geometry.
#   - Hair, cloth, robes, hoods, moss are "a solid sculpted mass" / "a closed
#     solid volume down to the base".
#   - Water, smoke, ground effects are a solid sculpted shape on the base.
#   - Write a `# Shape:` comment above each boss (e.g. "bulky quadruped",
#     "robed humanoid + serpent coils") — it keeps the notes honest.
#
# FIELDS (per boss):
#   slug      lowercase kebab-case, unique; also the folder name
#   name      display name only — NEVER reaches the stills prompt (proper
#             nouns come back as painted lettering)
#   desc      appearance only, no names, no lore
#   palette   3-5 colour words (ignored for finish: grey)
#   views     [front, back] is the proven pair
#   finish    painted | grey
#   notes     sculpt constraints, in the house style above
#   back      required with a back view: what is visible from behind and
#             what is hidden (PLAYBOOK.md "Back-view rule")
#   portrait  prompt for the painted portrait (`mini.py portraits`); lore
#             words are fine here, it is not a Meshy input

name: Molten Core

# Appended to every boss `portrait:` as "<portrait>. <portrait_style>".
# Replace the ATMOSPHERE phrase with this dungeon's setting.
portrait_style: >-
  richly textured oil painting on rough canvas, visible brush strokes and
  impasto, painterly fantasy video-game concept art in the style of classic
  World of Warcraft loading-screen illustration, dramatic rim lighting,
  vast volcanic cavern of black basalt and rivers of glowing magma, embers drifting through red smoke, single subject centered, three-quarter view, full figure,
  no text, no lettering, no frame, no border

# Entry ids: chronicle hostiles.go MoltenCoreHostiles (map 409), confirmed
# against two OctoWoW lockouts on N'Zoth (2026-10-16/17, 12/12 kills each).
# Turtle 1.18.0 removed Gehennas (12259); no Gehennas units in either log.

bosses:
  # Shape: flamewaker — huge muscular torso on a fat serpent tail coiled on the base. Entry 12118.
  - slug: lucifron
    name: Lucifron
    desc: a giant serpent-bodied fire demon rising from a fat coiled snake tail on the base, a broad muscular grey-skinned torso with a pale ribbed scaly belly, two thick clawed arms held forward, a small fierce head with a short snout and a heavy jaw, a tall crown of six thick curved horn-tendrils banded grey and cream sweeping up and back from the head, short thick bony spurs on the forearms and shoulders
    palette: [ash grey, bone cream, charcoal, ember orange]
    views: [front, back]
    finish: painted
    notes: the snake tail is one fat coil resting on the base along its whole length; the horn-tendrils are thick as a thumb, few in number and fused to each other at the root like a solid crown; forearm spurs are short chunky cones; the ember glow is only a paint accent
    back: From behind, the broad grey back and the backs of the thick horn-tendril crown fill the view, the body tapering down into the heavy coiled tail on the base. The face, belly and hands are hidden in front.
    portrait: Lucifron, the flamewaker lieutenant of Ragnaros, a grey serpent-tailed fire demon with a crown of horn-tendrils, casting a dark curse amid molten rock

