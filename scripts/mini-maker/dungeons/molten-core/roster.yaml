    views: [front, back]
    finish: painted
    notes: the two heads are fused at the neck into one thick mass; back plates are short thick slabs fused to the spine, no thin spikes; legs merge into the base; the short thick tail rests on the base; the molten glow is only a paint pattern in the cracks
    back: From behind, the broad armoured back with its ridge of thick plates fills the view, the two heads just visible over the shoulders, the rear legs and the short tail resting on the base. The faces and jaws are hidden in front.
    portrait: Magmadar, the two-headed core hound of Molten Core, jaws dripping magma, lava breath roaring across a cavern of fire

