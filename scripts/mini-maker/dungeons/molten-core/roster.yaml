    desc: a huge two-headed molten hound standing four-square on the base, a massive barrel chest and short thick legs, two broad heads side by side with open jaws showing a few short thick fangs and glowing molten throats, a thick ridge of heavy curved armour plates along the neck and back, cracked dark red-brown rocky hide with glowing orange seams
