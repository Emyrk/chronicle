    back: From behind, the spiky hair crest, the backs of the red shoulder plates, the leather back and the heels on the base are visible; the daggers are hidden at the sides.
    portrait: Renataki of the Thousand Blades, a troll rogue spirit summoned at the Edge of Madness, vanishing into shadow with blades drawn

