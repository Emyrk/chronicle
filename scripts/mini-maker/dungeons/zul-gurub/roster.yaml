    back: From behind, the armored back, the square pauldrons, the hair crest and the heels on the base are visible, with the hammer head on the base at one side.
    portrait: Wushoolay the Storm Witch, a troll storm-caller summoned at the Edge of Madness, green lightning crackling around a great hammer

